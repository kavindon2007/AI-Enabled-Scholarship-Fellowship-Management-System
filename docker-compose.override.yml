version: "3.9"

# Development overrides — extra logging, debug ports
services:
  postgres:
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    # Enable query logging in dev
    command: >
      postgres
        -c log_statement=all
        -c log_duration=on
        -c log_min_duration_statement=100

  redis:
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru --loglevel verbose

  kafka:
    environment:
      KAFKA_LOG_RETENTION_HOURS: 24  # Shorter retention in dev